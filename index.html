            {
              "@type": "Question",
              "name": "¿Qué es la Ley 21.719 de Protección de Datos Personales en Chile?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "La Ley 21.719 modifica sustancialmente la Ley 19.628, estableciendo un nuevo estándar de protección de datos en Chile similar al RGPD europeo. Crea la Agencia de Protección de Datos Personales (APDP), consagra los derechos ARCOP y sanciona infracciones con multas de hasta 20.000 UTM o entre el 2% y 4% de las ventas anuales."
              }
            },
            {
              "@type": "Question",
              "name": "¿Qué son los derechos ARCOP en Chile?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Los derechos ARCOP son las facultades que tienen las personas sobre sus datos: Acceso, Rectificación, Cancelación/Supresión, Oposición, Portabilidad y Bloqueo Temporal. El Bloqueo Temporal tiene un SLA legal estricto de 2 días hábiles, mientras que el resto de derechos deben ser respondidos en un plazo máximo de 30 días corridos."
              }
            },
            {
              "@type": "Question",
              "name": "¿Qué es el Registro de Actividades de Tratamiento (RAT) del Artículo 14 ter?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "El RAT es el inventario legal obligatorio (Tramo 1) que toda empresa en Chile debe mantener disponible para la APDP. Contiene las finalidades del tratamiento, categorías de datos personales y sensibles (salud, biométricos, RUT), bases de licitud (Art. 12 y 13), plazos de conservación y medidas de seguridad."
              }
            },
            {
              "@type": "Question",
              "name": "¿Cómo beneficia el Estatuto Pyme (Ley 20.416) a las empresas ante la APDP?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Las Micro y Pequeñas empresas en Chile pueden optar a una amonestación escrita en lugar de una multa pecuniaria en su primera infracción, siempre que no sean reincidentes y acrediten la regularización inmediata presentando su Registro de Actividades de Tratamiento (RAT)."
              }
            }
          ]
        }
